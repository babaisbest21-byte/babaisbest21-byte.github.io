<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurderV | Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .profile-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #ff3333;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
        }

        .profile-subtitle {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 32px;
            font-weight: 500;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #141414;
            border: 1px solid #222222;
            padding: 16px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.25s ease;
            position: relative;
        }

        /* Roblox Button Style */
        .link-card.roblox {
            background: linear-gradient(135deg, #ff3333 0%, #990000 100%);
            border: none;
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.25);
        }

        .link-card.roblox:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 51, 51, 0.4);
            background: linear-gradient(135deg, #ff4444 0%, #b30000 100%);
        }

        /* Discord Button Style */
        .link-card.discord {
            background: #5865F2;
            border: none;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.25);
        }

        .link-card.discord:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(88, 101, 242, 0.4);
            background: #6b77f5;
        }

        /* Placeholder Style */
        .link-card.standard:hover {
            transform: translateY(-2px);
            background: #1c1c1c;
            border-color: #ff3333;
        }

        .coming-soon {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="profile-title">MurderV</h1>
        <p class="profile-subtitle">Official Community Hub</p>

        <div class="links-wrapper">
            <!-- ROBLOX LINK -->
            <a href="https://www.roblox.com/share?code=7dacc4804d996642ba6f0640f7272b07&type=ExperienceDetails&stamp=1789928445633" 
               target="_blank" 
               class="link-card roblox">
               🎮 Play Scope Simulator on Roblox
            </a>

            <!-- DISCORD LINK -->
            <a href="https://discord.gg" 
               target="_blank" 
               class="link-card discord">
               💬 Join Our Discord Server
            </a>

            <!-- FUTURE YOUTUBE LINK -->
            <a href="#" class="link-card standard coming-soon">
               🎬 YouTube Channel (Coming Soon)
            </a>
        </div>
    </div>

</body>
</html>
