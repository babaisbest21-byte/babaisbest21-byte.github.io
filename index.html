<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MurderV | Community Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #050505;
            /* Cool gaming cyber-grid background effect */
            background-image: 
                linear-gradient(rgba(255, 51, 51, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 51, 51, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
            background: rgba(15, 15, 15, 0.75);
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 51, 51, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo-area {
            margin-bottom: 35px;
        }

        .profile-title {
            font-size: 3rem;
            font-weight: 900;
            color: #ff3333;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
            /* Aggressive neon glow effect */
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.6), 0 0 30px rgba(255, 51, 51, 0.2);
            animation: pulse Glow 3s infinite alternate;
        }

        .profile-subtitle {
            font-size: 0.95rem;
            color: #aaaaaa;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
        }

        /* Roblox Premium Gradient styling */
        .link-card.roblox {
            background: linear-gradient(135deg, #e60000 0%, #990000 100%);
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.3);
        }

        .link-card.roblox:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(230, 0, 0, 0.5);
            background: linear-gradient(135deg, #ff1a1a 0%, #b30000 100%);
        }

        /* Discord Premium Blur styling */
        .link-card.discord {
            background: linear-gradient(135deg, #5865F2 0%, #404eed 100%);
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .link-card.discord:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.5);
            background: linear-gradient(135deg, #6b77f5 0%, #525fed 100%);
        }

        /* Coming Soon Clean Sleek border style */
        .link-card.standard {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #666666;
            cursor: not-allowed;
        }

        .link-card.standard:hover {
            border-color: rgba(255, 51, 51, 0.3);
            color: #888888;
        }

        /* Visual icons adjustment */
        .icon {
            margin-right: 10px;
            font-size: 1.25rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Upgraded Header -->
        <div class="logo-area">
            <h1 class="profile-title">MurderV</h1>
            <p class="profile-subtitle">Official Community Hub</p>
        </div>

        <!-- Links List -->
        <div class="links-wrapper">
            <!-- ROBLOX LINK -->
            <a href="https://roblox.com" 
               target="_blank" 
               class="link-card roblox">
               <span class="icon">🎮</span> Play Scope Simulator on Roblox
            </a>

            <!-- DISCORD LINK -->
            <a href="https://discord.gg/gcmJJfHsre" 
               target="_blank" 
               class="link-card discord">
               <span class="icon">💬</span> Join Our Discord Server
            </a>

            <!-- FUTURE YOUTUBE LINK -->
            <a href="#" class="link-card standard">
               <span class="icon">🎬</span> YouTube Channel (Coming Soon)
            </a>
        </div>
    </div>

</body>
</html>
